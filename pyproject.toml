[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crispdm"
version = "0.1.0"
description = "Prediccion de Deposito Bancarios v2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.5",
    "category-encoders>=2.6.4",
    "feature-engine>=1.8.2",
    "ipykernel>=6.29.5",
    "matplotlib>=3.9.2",
    "mkdocs>=1.6.1",
    "matplotlib>=3.9.2",
    "mkdocs>=1.6.1",
    "mlflow>=2.21.0",
    "nbformat>=5.10.4",
    "numpy<2.5",
    "pandas>=2.2.3",
    "evidently>=0.4.38",
    "plotly>=5.24.1",
    "scikit-learn>=1.5.2",
    "seaborn>=0.13.2",
    "shap>=0.40.0",
    "streamlit>=1.43.2",
    "ucimlrepo>=0.0.7",
    "xgboost>=2.1.4",
    "pydantic-settings>=2.0.0",
    "google-genai>=0.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pytest>=7.0.0",
    "dvc>=3.55.0",
    "dvc-s3>=3.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
